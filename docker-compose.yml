services:
  # 1. Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: diskominfo_db
    restart: always
    environment:
      MYSQL_DATABASE: diskominfo_crud
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: diskominfo
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - diskominfo_net

  # 2. Backend Service (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diskominfo_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: diskominfo_crud
      DB_USERNAME: diskominfo
      DB_PASSWORD: password
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - diskominfo_net

  # 3. Frontend Service (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diskominfo_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - diskominfo_net

networks:
  diskominfo_net:
    driver: bridge

volumes:
  db_data: